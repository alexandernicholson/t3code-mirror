name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      extended:
        description: Run unused-code, desktop build, release smoke, and Rust checks
        type: boolean
        default: false
      mobile_native:
        description: Run Swift and Kotlin static analysis on macOS
        type: boolean
        default: false

permissions:
  contents: read

# Keep PR and main validation, but stop spending minutes on superseded commits.
concurrency:
  group: ci-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Check
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          sparse-checkout: |
            /*
            !/.repos/
          sparse-checkout-cone-mode: false

      - name: Reject repository-owned PR assets
        run: |
          files="$(git ls-files .github/pr-assets)"
          if test -n "$files"; then
            printf 'PR evidence must be attached directly to a PR, not committed or hosted in releases:\n%s\n' "$files" >&2
            exit 1
          fi

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: package.json
          cache: true
          run-install: true

      - name: Validate fork release metadata
        env:
          RELEASE_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if test -n "$RELEASE_BASE" && test "$RELEASE_BASE" != "0000000000000000000000000000000000000000"; then
            git fetch --no-tags origin "$RELEASE_BASE"
            vp run release:check --base "$RELEASE_BASE"
          else
            vp run release:check
          fi

      - name: Format and lint
        run: vp check

      - name: Typecheck
        run: vpr typecheck

      - name: Ensure Electron runtime is installed
        run: vp run --filter @t3tools/desktop ensure:electron

      - name: Install browser secret helper build libraries
        run: sudo apt-get update && sudo apt-get install -y libsecret-1-dev pkg-config

      - name: Test nightly release checks
        run: node --test .github/scripts/check-nightly-release.test.cjs

      # One install for all suites. Run the server separately to preserve its
      # serial file isolation and avoid contention with the client suites.
      - name: Test clients and packages
        run: vp run --parallel --concurrency-limit 2 --filter '!t3' --filter '!@t3tools/monorepo' test

      - name: Test server
        env:
          T3CODE_TRANSFER_BUDGET_REPORT_PATH: ${{ runner.temp }}/t3code-transfer-budget.md
        run: vp run --filter t3 test

      - name: Publish transfer budget summary
        if: always()
        run: |
          if test -f "$RUNNER_TEMP/t3code-transfer-budget.md"; then
            cat "$RUNNER_TEMP/t3code-transfer-budget.md" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Check unused code
        if: github.event_name == 'workflow_dispatch' && inputs.extended
        run: vp run knip:check

      - name: Build desktop pipeline and verify preload
        if: github.event_name == 'workflow_dispatch' && inputs.extended
        run: |
          vp run build:desktop
          node apps/desktop/scripts/verify-preload-bundle.mjs

      - name: Exercise release-only workflow steps
        if: github.event_name == 'workflow_dispatch' && inputs.extended
        run: node scripts/release-smoke.ts

      - name: Setup Rust
        if: github.event_name == 'workflow_dispatch' && inputs.extended
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Check Rust crates
        if: github.event_name == 'workflow_dispatch' && inputs.extended
        run: |
          for crate in resource-monitor kde-snap-shot hyprland-snap-shot; do
            cargo fmt --manifest-path "native/$crate/Cargo.toml" -- --check
            cargo test --locked --manifest-path "native/$crate/Cargo.toml"
          done

  mobile_native_static_analysis:
    name: Mobile Native Static Analysis
    if: github.event_name == 'workflow_dispatch' && inputs.mobile_native
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          sparse-checkout: |
            /*
            !/.repos/
          sparse-checkout-cone-mode: false

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: package.json
          cache: true
          run-install: |
            args:
              - --filter=@t3tools/scripts...

      - name: Install mobile native static analysis tools
        run: brew bundle install --file apps/mobile/Brewfile

      - name: Lint mobile native sources
        run: vp run lint:mobile
